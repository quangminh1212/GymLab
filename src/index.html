<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymLab</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
    <div id="app">
        <button id="menu-btn" aria-label="Menu"></button>
        <div id="menu-overlay"></div>
        <nav id="sidebar">
            <div class="logo">
                <span class="logo-icon" id="logo-icon"></span>
                <span class="logo-text">GymLab</span>
            </div>
            <ul class="nav-links" id="nav-links">
                <li class="active" data-page="home"><span class="nav-icon" data-icon="home"></span><span>Trang chủ</span></li>
                <li data-page="add"><span class="nav-icon" data-icon="plus"></span><span>Thêm buổi tập</span></li>
                <li data-page="history"><span class="nav-icon" data-icon="clipboard"></span><span>Lịch sử</span></li>
                <li data-page="stats"><span class="nav-icon" data-icon="chart"></span><span>Thống kê</span></li>
                <li data-page="settings"><span class="nav-icon" data-icon="gear"></span><span>Cài đặt</span></li>
            </ul>
            <div class="nav-footer"><span class="version">v1.0.0</span></div>
        </nav>
        <main id="content">
            <div id="page-home" class="page active">
                <header class="page-header">
                    <div>
                        <h1 id="greeting">Xin chào!</h1>
                        <p id="date-display" class="subtitle"></p>
                    </div>
                </header>
                <div class="stats-grid" id="stats-grid"></div>
                <div class="section">
                    <h2>Buổi tập hôm nay</h2>
                    <div id="today-list" class="workout-list"></div>
                </div>
            </div>
            <div id="page-add" class="page">
                <header class="page-header"><h1>Thêm buổi tập</h1></header>
                <div class="form-card">
                    <div class="form-group">
                        <label>Nhóm bài tập</label>
                        <div id="category-chips" class="chip-group"></div>
                    </div>
                    <div class="form-group"><label>Bài tập</label><div id="exercise-list" class="exercise-select"></div></div>
                    <div class="form-row">
                        <div class="form-group"><label>Sets</label><input type="number" id="input-sets" value="3" min="1" max="100"></div>
                        <div class="form-group"><label>Reps</label><input type="number" id="input-reps" value="10" min="1" max="1000"></div>
                        <div class="form-group"><label>kg</label><input type="number" id="input-weight" value="50" min="0" max="500" step="0.5"></div>
                    </div>
                    <div class="form-group"><label>Thời gian (phút)</label><input type="number" id="input-duration" value="30" min="0" max="300"></div>
                    <div class="form-group"><label>Ghi chú</label><textarea id="input-notes" rows="2" placeholder="Ghi chú..."></textarea></div>
                    <div class="preview-card"><div class="preview-label">Ước tính calo</div><div class="preview-value" id="preview-calories">0</div><div class="preview-sub">kcal</div></div>
                    <button id="btn-save" class="btn btn-primary btn-full"><span class="btn-icon" data-icon="save"></span> Lưu buổi tập</button>
                </div>
            </div>
            <div id="page-history" class="page">
                <header class="page-header"><h1>Lịch sử</h1></header>
                <div class="filter-bar" id="history-filters"></div>
                <div id="history-list" class="workout-list"></div>
            </div>
            <div id="page-stats" class="page">
                <header class="page-header"><h1>Thống kê</h1></header>
                <div class="filter-bar" id="stats-filters"></div>
                <div class="stats-overview" id="stats-overview"></div>
                <div class="chart-container"><h3>Calo theo ngày</h3><canvas id="chart-calories"></canvas></div>
                <div class="chart-container"><h3>Phân bổ bài tập</h3><canvas id="chart-distribution"></canvas></div>
            </div>
            <div id="page-settings" class="page">
                <header class="page-header"><h1>Cài đặt</h1></header>
                <div class="form-card">
                    <div class="form-group"><label>Tên</label><input type="text" id="input-username" placeholder="Tên..."></div>
                    <div class="form-group"><label>Cân nặng (kg)</label><input type="number" id="input-bodyweight" value="70" min="20" max="300" step="0.5"><small>Tính calories theo ACSM</small></div>
                    <button id="btn-save-settings" class="btn btn-primary">Lưu</button>
                </div>
            </div>
        </main>
    </div>
    <script src="js/icons.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
