name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (check + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cd src-tauri && cargo check --all-targets
      - name: Clippy
        run: cd src-tauri && cargo clippy -- -D warnings
      - name: Format
        run: cd src-tauri && cargo fmt --check
      - name: Test
        run: cd src-tauri && cargo test

  frontend:
    name: Frontend (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: |
          # Check for unclosed tags (basic)
          python3 -c "
          html = open('src/index.html').read()
          opens = html.count('<div')
          closes = html.count('</div>')
          assert opens == closes, f'div mismatch: {opens} opens vs {closes} closes'
          print(f'HTML OK: {opens} divs balanced')
          "
      - name: Validate JS syntax
        run: |
          node --check src/js/app.js && echo "app.js: OK"
          node --check src/js/api.js && echo "api.js: OK"
          node --check src/js/icons.js && echo "icons.js: OK"
          node --check src/js/video-analysis-core.js && echo "video-analysis-core.js: OK"
          node --check src/js/video-analysis.js && echo "video-analysis.js: OK"
          node tests/video-analysis-core.test.mjs
          python3 -m py_compile tests/video-analysis-e2e.py tests/packaged-video-smoke.py tests/collect_benchmark_audits.py tests/generate_weight_fixture.py tests/evaluate_benchmark.py tests/test_evaluate_benchmark.py tests/prepare_benchmark_manifest.py tests/test_prepare_benchmark_manifest.py tests/prepare_profile_labels.py tests/test_prepare_profile_labels.py tests/train_profile_model.py tests/test_train_profile_model.py tests/promote_profile_model.py tests/test_promote_profile_model.py
          python3 tests/test_evaluate_benchmark.py
          python3 tests/test_prepare_benchmark_manifest.py
          python3 tests/test_prepare_profile_labels.py
          python3 tests/test_train_profile_model.py
          python3 tests/test_promote_profile_model.py
      - name: Validate local inference assets
        run: |
          test -f src/models/pose_landmarker_lite.task
          test -f src/models/tessdata/eng.traineddata.gz
          test -f src/vendor/mediapipe/vision_bundle.mjs
          test -f src/vendor/tesseract/worker.min.js
          echo "59929e1d1ee95287735ddd833b19cf4ac46d29bc7afddbbf6753c459690d574a  src/models/pose_landmarker_lite.task" | sha256sum -c -
          echo "ed350f3752f81ee8f38769edc14d92d997dababe23b565c59879372cc46a2468  src/models/tessdata/eng.traineddata.gz" | sha256sum -c -
      - name: Validate CSS
        run: |
          python3 -c "
          css = open('src/css/style.css').read()
          opens = css.count('{')
          closes = css.count('}')
          assert opens == closes, f'CSS brace mismatch: {opens} vs {closes}'
          print(f'CSS OK: {opens} rule blocks balanced')
          "

  build:
    name: Build (Tauri)
    needs: [rust, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Node deps
        run: npm install
      - name: Build
        run: cd src-tauri && cargo build --release

  windows-release-smoke:
    name: Windows packaged video smoke
    needs: [rust, frontend]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Node dependencies
        run: npm ci
      - name: Install packaged smoke dependencies
        run: python -m pip install playwright
      - name: Install Playwright browser
        run: python -m playwright install chromium
      - name: Build Windows release bundles
        run: npm run build
      - name: Verify exact packaged video flow
        run: python tests/packaged-video-smoke.py --port 9350
